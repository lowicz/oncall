# SonarCloud project identity (https://sonarcloud.io).
# Scanned from GitHub Actions by the sonarcloud job in .github/workflows/ci.yml.
sonar.projectKey=lowicz_oncall
sonar.organization=lowicz

# Product code that CI already builds: the Python backend and the frontend SPA.
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=backend/tests/**,frontend/src/test/**,**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.spec.ts,**/*.spec.tsx

# Coverage from the backend and frontend CI jobs (.github/workflows/ci.yml).
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPath=frontend/tsconfig.app.json

# The per-language translation catalogs are data, not logic: each locale under
# frontend/src/i18n/{pl,en}/ and backend/src/oncall/i18n/{pl,en}.py is a flat
# table of strings (plus a few interpolation arrows). The English tables mirror
# the Polish keys by design - tsc and tests/test_i18n.py enforce that parity -
# so they read as duplicates, and only the default Polish strings are exercised
# by the locked baseline, leaving the English arrows "uncovered". Measuring
# either as a code smell is noise, so the catalogs are excluded from coverage
# and duplication. The i18n runtime (language.ts, messages.ts, middleware.py,
# __init__.py) lives outside these paths and stays measured.
sonar.coverage.exclusions=frontend/src/i18n/pl/**,frontend/src/i18n/en/**,backend/src/oncall/i18n/pl.py,backend/src/oncall/i18n/en.py
sonar.cpd.exclusions=frontend/src/i18n/pl/**,frontend/src/i18n/en/**,backend/src/oncall/i18n/pl.py,backend/src/oncall/i18n/en.py

# The catalogs carry user-facing sentences about passwords (e.g. "Hasło nie
# może być takie jak login"); S2068 reads the word as a hard-coded credential.
# These are translation strings, never secrets, so the rule is ignored for the
# catalog files only.
sonar.issue.ignore.multicriteria=i18ncreds,raises1,raises2,raises3,raises4,raises5,raises6,raises7,raises8,raises9,raises10,raises11,raises12,raises13,raises14,raises15,assertion1,assertion2,assertion3,assertion4,assertion5,assertion6,assertion7,assertion8,assertion9,assertion10,assertion11,assertion12,assertion13,assertion14,assertion15,assertion16,assertion17,assertion18,props1,props2,props3,props4,props5,props6,props7,props8,props9,props10,props11,props12,props13,props14,props15,props16,props17,props18,props19,props20,props21,props22,props23,props24,props25,props26,props27,props28,props29,props30,props31,props32,props33,props34,props35,props36,props37,props38,props39,props40,props41,props42,props43,schema1,schema2,schema3,schema4,schema5,schema6,schema7,schema8,schema9,schema10,schema11,schema12,schema13,schema14,asyncport1,asyncport2,asyncport3,asyncport4,asyncport5,asyncport6,asyncport7,asyncport8,asyncport9,asyncport10,asyncport11,asyncport12,pyflow1,pyflow2,pyflow3,pyflow4,pyflow5,pyflow6,pyflow7,pyflow8,pyflow9,pyflow10,pyflow11,pyflow12,pyflow13,tsflow1,tsflow2,tsflow3,tsflow4,tsflow5,tsflow6,tsflow7,tsflow8,ternary1,ternary2,ternary3,ternary4,ternary5,ternary6,ternary7,ternary8,ternary9,ternary10,ternary11,ternary12,ternary13,ternary14,ternary15,ternary16,ternary17,ternary18,ternary19,ternary20,ternary21,aria1,aria2,aria3,aria4,aria5,aria6,aria7,aria8,aria9,aria10,aria11,aria12,aria13,literal1,literal2,literal3,literal4,literal5,literal6,literal7,template1,template2,template3,template4,template5,template6,template7,indexkey1,indexkey2,indexkey3,indexkey4,dependsscope1,dependsscope2,dependsscope3,localcomponent1,localcomponent2,stringify1,stringify2,isodate1,isodate2,solverargs1,bindcontext1,privatenet1,ldapstarttls1,replaceview1,replaceschedule1,asciiphone1,slotkeys1,rotationmodes1,localdb1,activedescendantclick1,menuanchor1,scrollfocus1,activedescendantfocus1
