# SonarCloud project identity (https://sonarcloud.io).
# Scanned from GitHub Actions by the sonarcloud job in .github/workflows/ci.yml.
sonar.projectKey=lowicz_oncall
sonar.organization=lowicz

# Product code that CI already builds: the Python backend and the frontend SPA.
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=backend/tests/**,frontend/src/test/**,**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.spec.ts,**/*.spec.tsx

# Coverage from the backend and frontend CI jobs (.github/workflows/ci.yml).
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPath=frontend/tsconfig.app.json

# The per-language translation catalogs are data, not logic: each locale under
# frontend/src/i18n/{pl,en}/ and backend/src/oncall/i18n/{pl,en}.py is a flat
# table of strings (plus a few interpolation arrows). The English tables mirror
# the Polish keys by design - tsc and tests/test_i18n.py enforce that parity -
# so they read as duplicates, and only the default Polish strings are exercised
# by the locked baseline, leaving the English arrows "uncovered". Measuring
# either as a code smell is noise, so the catalogs are excluded from coverage
# and duplication. The i18n runtime (language.ts, messages.ts, middleware.py,
# __init__.py) lives outside these paths and stays measured.
sonar.coverage.exclusions=frontend/src/i18n/pl/**,frontend/src/i18n/en/**,backend/src/oncall/i18n/pl.py,backend/src/oncall/i18n/en.py
sonar.cpd.exclusions=frontend/src/i18n/pl/**,frontend/src/i18n/en/**,backend/src/oncall/i18n/pl.py,backend/src/oncall/i18n/en.py

# The catalogs carry user-facing sentences about passwords (e.g. "Hasło nie
# może być takie jak login"); S2068 reads the word as a hard-coded credential.
# These are translation strings, never secrets, so the rule is ignored for the
# catalog files only.
sonar.issue.ignore.multicriteria=i18ncreds
sonar.issue.ignore.multicriteria.i18ncreds.ruleKey=python:S2068
sonar.issue.ignore.multicriteria.i18ncreds.resourceKey=backend/src/oncall/i18n/*.py
