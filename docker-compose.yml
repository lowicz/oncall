# Production: every service runs from a published image.
#
#   cp .env.example .env      # set ONCALL_VERSION and the admin credentials
#   docker compose pull
#   docker compose up -d
#
# ONCALL_VERSION names the release to run (docs/wdrozenie/wydania.md). Without
# it Compose refuses to start instead of guessing: a host always states what
# it runs, and a rollback is that one line changed back.
#
# Building from this checkout is an overlay, not a switch in this file:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# HTTPS is another overlay (docker-compose.tls.yml, docs/wdrozenie/tls.md).
# Both files work unchanged under Docker Compose and Podman Compose.
x-api-image: &api-image ghcr.io/lowicz/oncall-api:${ONCALL_VERSION:?set ONCALL_VERSION in .env - a release version for production, dev with docker-compose.dev.yml - see docs/wdrozenie/wydania.md}
x-web-image: &web-image ghcr.io/lowicz/oncall-web:${ONCALL_VERSION:?set ONCALL_VERSION in .env - a release version for production, dev with docker-compose.dev.yml - see docs/wdrozenie/wydania.md}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oncall}
      POSTGRES_USER: ${POSTGRES_USER:-oncall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oncall}
    volumes:
      - oncall-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oncall} -d ${POSTGRES_DB:-oncall}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: *api-image
    restart: unless-stopped
    environment:
      ONCALL_DATABASE_URL: ${ONCALL_DATABASE_URL:-postgresql+asyncpg://oncall:oncall@db:5432/oncall}
      ONCALL_EFFECTIVE_ASSIGNMENTS_CACHE_SECONDS: ${ONCALL_EFFECTIVE_ASSIGNMENTS_CACHE_SECONDS:-1}
      ONCALL_SESSION_COOKIE_SECURE: ${ONCALL_SESSION_COOKIE_SECURE:-false}
      ONCALL_ADMIN_USERNAME: ${ONCALL_ADMIN_USERNAME:-}
      ONCALL_ADMIN_PASSWORD: ${ONCALL_ADMIN_PASSWORD:-}
      ONCALL_ADMIN_DISPLAY_NAME: ${ONCALL_ADMIN_DISPLAY_NAME:-Administrator}
      ONCALL_LDAP_ENABLED: ${ONCALL_LDAP_ENABLED:-false}
      ONCALL_LDAP_SERVER_URI: ${ONCALL_LDAP_SERVER_URI:-}
      ONCALL_LDAP_BIND_DN: ${ONCALL_LDAP_BIND_DN:-}
      ONCALL_LDAP_BIND_PASSWORD: ${ONCALL_LDAP_BIND_PASSWORD:-}
      ONCALL_LDAP_BASE_DN: ${ONCALL_LDAP_BASE_DN:-}
      ONCALL_LDAP_USER_FILTER: ${ONCALL_LDAP_USER_FILTER:-}
      ONCALL_LDAP_START_TLS: ${ONCALL_LDAP_START_TLS:-true}
      ONCALL_LDAP_ATTRIBUTE_PERSONNEL_NUMBER: ${ONCALL_LDAP_ATTRIBUTE_PERSONNEL_NUMBER:-employeeNumber}
      ONCALL_LDAP_ATTRIBUTE_FIRST_NAME: ${ONCALL_LDAP_ATTRIBUTE_FIRST_NAME:-givenName}
      ONCALL_LDAP_ATTRIBUTE_LAST_NAME: ${ONCALL_LDAP_ATTRIBUTE_LAST_NAME:-sn}
      ONCALL_LDAP_ATTRIBUTE_EMAIL: ${ONCALL_LDAP_ATTRIBUTE_EMAIL:-mail}
      ONCALL_SMTP_HOST: ${ONCALL_SMTP_HOST:-}
      ONCALL_SMTP_PORT: ${ONCALL_SMTP_PORT:-587}
      ONCALL_SMTP_USERNAME: ${ONCALL_SMTP_USERNAME:-}
      ONCALL_SMTP_PASSWORD: ${ONCALL_SMTP_PASSWORD:-}
      ONCALL_SMTP_LOCAL_HOSTNAME: ${ONCALL_SMTP_LOCAL_HOSTNAME:-}
      ONCALL_SMTP_USE_TLS: ${ONCALL_SMTP_USE_TLS:-false}
      ONCALL_SMTP_STARTTLS: ${ONCALL_SMTP_STARTTLS:-true}
      ONCALL_EMAIL_FROM: ${ONCALL_EMAIL_FROM:-Erste On-call <oncall@example.com>}
      ONCALL_PUBLIC_BASE_URL: ${ONCALL_PUBLIC_BASE_URL:-http://localhost:8080}
      ONCALL_HANDOVER_REMINDER_HOUR: ${ONCALL_HANDOVER_REMINDER_HOUR:-9}
      ONCALL_SOLVER_SECONDS: ${ONCALL_SOLVER_SECONDS:-15}
      ONCALL_SOLVER_LOG: ${ONCALL_SOLVER_LOG:-false}
      ONCALL_API_WORKERS: ${ONCALL_API_WORKERS:-}
    # The image has no curl; its own interpreter asks the health endpoint.
    # start_period covers `alembic upgrade head` and the admin bootstrap that
    # run before uvicorn listens.
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy

  worker:
    # The same image as the API, running the outbox and generation worker.
    image: *api-image
    restart: unless-stopped
    command: ["python", "-m", "oncall.worker"]
    environment:
      ONCALL_DATABASE_URL: ${ONCALL_DATABASE_URL:-postgresql+asyncpg://oncall:oncall@db:5432/oncall}
      ONCALL_SMTP_HOST: ${ONCALL_SMTP_HOST:-}
      ONCALL_SMTP_PORT: ${ONCALL_SMTP_PORT:-587}
      ONCALL_SMTP_USERNAME: ${ONCALL_SMTP_USERNAME:-}
      ONCALL_SMTP_PASSWORD: ${ONCALL_SMTP_PASSWORD:-}
      ONCALL_SMTP_LOCAL_HOSTNAME: ${ONCALL_SMTP_LOCAL_HOSTNAME:-}
      ONCALL_SMTP_USE_TLS: ${ONCALL_SMTP_USE_TLS:-false}
      ONCALL_SMTP_STARTTLS: ${ONCALL_SMTP_STARTTLS:-true}
      ONCALL_EMAIL_FROM: ${ONCALL_EMAIL_FROM:-Erste On-call <oncall@example.com>}
      ONCALL_PUBLIC_BASE_URL: ${ONCALL_PUBLIC_BASE_URL:-http://localhost:8080}
      ONCALL_HANDOVER_REMINDER_HOUR: ${ONCALL_HANDOVER_REMINDER_HOUR:-9}
      ONCALL_SOLVER_SECONDS: ${ONCALL_SOLVER_SECONDS:-15}
      ONCALL_SOLVER_LOG: ${ONCALL_SOLVER_LOG:-false}
      ONCALL_GENERATION_CONCURRENCY: ${ONCALL_GENERATION_CONCURRENCY:-1}
    # The default CP-SAT worker count is derived from this cgroup CPU quota.
    # ONCALL_SOLVER_WORKERS remains available as an explicit deployment override.
    # ONCALL_GENERATION_CONCURRENCY runs more than one solve in parallel; keep it
    # at 1 unless the worker has cores to spare (two solves on two cores are
    # slower than two in sequence).
    cpus: 2.0
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

  web:
    # The image carries the application and the documentation: docs/*.md is
    # rendered to static HTML when the image is built
    # (frontend/scripts/build-docs.mjs) and served from the same nginx under
    # /docs/.
    image: *web-image
    restart: unless-stopped
    environment:
      ONCALL_TLS_ENABLED: ${ONCALL_TLS_ENABLED:-false}
    ports:
      - "${ONCALL_WEB_HTTP_PORT:-8080}:80"
      - "${ONCALL_WEB_HTTPS_PORT:-8443}:443"
    # Plain HTTP first; with the TLS overlay port 80 only redirects, so the
    # second request asks HTTPS directly (the certificate is the deployment's
    # own, not one this check can judge).
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/docs/index.html || wget -q -O /dev/null --no-check-certificate https://127.0.0.1/docs/index.html"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    # No TLS mounts here on purpose: this file must come up on a machine with
    # no certificate at all. HTTPS adds docker-compose.tls.yml, which mounts
    # the certificate, the key and the CA bundle as three separate files.
    # See docs/wdrozenie/tls.md.
    depends_on:
      api:
        condition: service_healthy

volumes:
  oncall-db:
