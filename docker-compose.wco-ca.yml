# The CA of a corporate proxy in front of Orange WCO, for the API and the
# worker. Use it as an overlay on the base file when the WCO service is reached
# through a TLS-inspecting proxy whose certificate the image does not trust:
#
#   docker compose -f docker-compose.yml -f docker-compose.wco-ca.yml up -d
#   podman compose -f docker-compose.yml -f docker-compose.wco-ca.yml up -d
#
# The worker switches the forwarding number and the api tests the connection,
# so both get the bundle. It combines with the TLS, LDAP and SMTP CA overlays.
# ONCALL_WCO_CA_FILE names the PEM bundle on the host; the default is the
# organisation bundle the TLS overlay mounts for nginx. Its CAs are added to the
# image's public roots, so the overlay never takes trust away. The file must
# exist, readable by the image's user, before the containers start: a bind
# source that does not exist is created as an empty directory.
#
# Full guide: docs/wdrozenie/uruchomienie.md, "Najważniejsze zmienne".
services:
  api:
    environment:
      ONCALL_WCO_CA_FILE: /etc/oncall/wco-ca.pem
    volumes:
      - ${ONCALL_WCO_CA_FILE:-./tls/ca.pem}:/etc/oncall/wco-ca.pem:ro
  worker:
    environment:
      ONCALL_WCO_CA_FILE: /etc/oncall/wco-ca.pem
    volumes:
      - ${ONCALL_WCO_CA_FILE:-./tls/ca.pem}:/etc/oncall/wco-ca.pem:ro
