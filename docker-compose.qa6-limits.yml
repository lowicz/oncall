# QA6: mirrors the target hardware resources (2-4 cores, 8 GB RAM).
# Used only for performance measurements, never for production.
services:
  api:
    cpus: 2.0
    mem_limit: 3g
  db:
    cpus: 1.0
    mem_limit: 2g
  worker:
    cpus: 2.0
    mem_limit: 2g
  web:
    cpus: 0.5
    mem_limit: 256m
