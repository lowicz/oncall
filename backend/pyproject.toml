[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oncall"
version = "0.1.0"
# The one interpreter CI tests and the image ships (PYTHON_VERSION in
# .github/workflows/ci.yml, backend/Dockerfile). An open upper bound would
# promise every future Python untested, and uv resolves the lock for each
# version promised: it fails the moment one dependency has no wheel for a
# version nobody runs (ortools had none for 3.15). Renovate's dashboard-gated
# "Python" group moves this bound with the runtime.
requires-python = ">=3.14,<3.15"
dependencies = [
  "aiosmtplib>=5.1,<6",
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "asyncpg>=0.30,<1",
  "email-validator>=2.0,<3",
  "fastapi>=0.116,<1",
  "holidays>=0.80,<1",
  "ldap3>=2.9.1,<3",
  "ortools>=9.14,<10",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "httpx>=0.28,<1",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/oncall"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "contract: externally observable compatibility behavior",
]
filterwarnings = [
  # QA7-L17: these come from inside pytest-asyncio and ldap3/pyasn1, not from
  # this application's own code - there is nothing here to fix, only to stop
  # drowning real warnings in noise. Revisit once the dependency is upgraded
  # past the version that still triggers them.
  "ignore:'asyncio.get_event_loop_policy' is deprecated:DeprecationWarning:pytest_asyncio",
  "ignore:'asyncio.set_event_loop_policy' is deprecated:DeprecationWarning:pytest_asyncio",
  "ignore:tagMap is deprecated. Please use TAG_MAP instead:DeprecationWarning:ldap3",
  "ignore:typeMap is deprecated. Please use TYPE_MAP instead:DeprecationWarning:ldap3",
]

[tool.uv]
# The application only ever runs on Linux (the container). Resolving the lock
# for every platform uv can imagine made Dependabot's uv updater fail on a
# `python >= 3.15 and sys_platform == 'win32'` split nobody deploys to.
environments = ["sys_platform == 'linux'"]
# The one uv release that reads and writes uv.lock: CI installs it
# (UV_VERSION in .github/workflows/ci.yml), the backend image copies it in
# (backend/Dockerfile) and Renovate installs it for its lockfile updates. uv
# refuses to run under any other release, so a drift fails loudly instead of
# resolving the lock differently. Renovate's "uv" group moves all three.
required-version = "==0.12.16"

[tool.ruff]
# No target-version: ruff takes it from the lower bound of requires-python,
# so the one Python version is written down once and moves with it.
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
# No python_version: mypy checks against the interpreter that runs it, the
# one requires-python allows.
strict = true
files = [
  # The whole domain: it is the layer with no framework in it, so there is
  # nothing here that strict typing has to be argued with.
  "src/oncall/domain",
  # The rule evaluator, which the domain imports as root policy. Phase 6f
  # taught it the rotation mode, so it is new code and belongs in the ratchet.
  # `workdays` and `coverage` already pass and can join whenever; `fairness`
  # has three real errors first.
  "src/oncall/rules.py",
  "src/oncall/database.py",
  "src/oncall/metrics.py",
  # The composition roots. Adapters satisfy the consumer-owned ports
  # structurally, without naming them, so this is where a missing or
  # mistyped method is caught; mypy follows the imports into every adapter.
  "src/oncall/bootstrap/providers.py",
  "src/oncall/infrastructure/sqlalchemy/handover.py",
  # The worker and what it drives. Every transaction it opens is a unit of
  # work named after its step, and the run's state transitions live in the
  # generation queue adapter rather than in the worker.
  "src/oncall/worker.py",
  "src/oncall/notifications/service.py",
  "src/oncall/policy.py",
  "src/oncall/infrastructure/sqlalchemy/scheduling_generation.py",
  "scripts/openapi_snapshot.py",
  "tests/architecture/test_dependencies.py",
  "tests/architecture/test_completion_dod.py",
  "tests/architecture/test_model_registry.py",
  # The mapped rows, each in the feature module that owns it, and the registry
  # that loads them all for the entry points, Alembic and the test bootstrap.
  "src/oncall/infrastructure/sqlalchemy/base.py",
  "src/oncall/infrastructure/sqlalchemy/model_registry.py",
  "src/oncall/infrastructure/sqlalchemy/access_models.py",
  "src/oncall/infrastructure/sqlalchemy/audit_model.py",
  "src/oncall/infrastructure/sqlalchemy/availability_model.py",
  "src/oncall/infrastructure/sqlalchemy/calendar_model.py",
  "src/oncall/infrastructure/sqlalchemy/notification_models.py",
  "src/oncall/infrastructure/sqlalchemy/scheduling_models.py",
  "src/oncall/infrastructure/sqlalchemy/sharing_models.py",
  "src/oncall/infrastructure/sqlalchemy/swap_models.py",
  "src/oncall/infrastructure/sqlalchemy/team_models.py",
  # Every presentation module except calendar.py, whose typing waits on the
  # `Duty.schedule_version` question recorded in the phase 4a note.
  "src/oncall/presentation/access.py",
  "src/oncall/presentation/admin.py",
  "src/oncall/presentation/assignments.py",
  "src/oncall/presentation/availability.py",
  "src/oncall/presentation/history.py",
  "src/oncall/presentation/overrides.py",
  "src/oncall/presentation/published.py",
  "src/oncall/presentation/reports.py",
  "src/oncall/presentation/rules.py",
  "src/oncall/presentation/scheduling.py",
  "src/oncall/presentation/sharing.py",
  "src/oncall/presentation/swaps.py",
  "src/oncall/presentation/system.py",
  "src/oncall/presentation/validation.py",
  # The solver. Typed once phases 4h-4o had given every piece of the model
  # builder a name and a signature; `generate_schedule` came with it.
  "src/oncall/scheduler.py",
]
