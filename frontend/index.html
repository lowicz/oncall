<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08131f" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Erste On-call</title>
    <script>
      // Apply the MUI color scheme before first paint (dark is the default).
      (function () {
        var scheme = 'dark'
        try {
          var mode = localStorage.getItem('mui-mode') || 'dark'
          scheme =
            mode === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : mode
        } catch (error) {}
        document.documentElement.setAttribute('data-mui-color-scheme', scheme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
