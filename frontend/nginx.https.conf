upstream oncall_api {
    server api:8000;
    keepalive 64;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;

    # Do not advertise the nginx version.
    server_tokens off;

    # Three separately mounted files, never a mounted directory; see
    # docs/wdrozenie/tls.md. The certificate is served on its own: the chain is
    # not concatenated into it, because clients of this deployment get their
    # intermediates from the same trust bundle mounted as ca.pem.
    ssl_certificate /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_trusted_certificate /etc/nginx/tls/ca.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # If the API is ever proxied over HTTPS, the same bundle verifies it:
    # proxy_ssl_trusted_certificate /etc/nginx/tls/ca.pem;
    # proxy_ssl_verify on;

    # Security headers for the whole server; the proxied /api and /calendar
    # locations below set no add_header of their own, so they inherit these.
    # Strict-Transport-Security belongs only on this HTTPS preset. The app ships
    # a strict CSP: the theme bootstrap is an external script (/theme-init.js),
    # so no inline-script allowance is needed.
    include /etc/nginx/security-headers.conf;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'" always;

    location /api/ {
        proxy_pass http://oncall_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # $remote_addr is the TCP peer nginx itself accepted the connection
        # from - unlike X-Forwarded-For, a client cannot make this header
        # carry any value but its own real address (QA7 par. 8, E1 review).
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /calendar/ {
        proxy_pass http://oncall_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Static documentation, rendered from docs/*.md into the frontend's own
    # production assets. It needs a location of its own: the SPA fallback below
    # would answer /docs/ with the application shell, and the router would then
    # bounce the unknown path back to the dashboard.
    #
    # The re-declared add_headers (nginx drops inherited ones once a block sets
    # any): the documentation pages carry small inline bootstrap scripts, so
    # their CSP allows 'unsafe-inline' for scripts - the content is static,
    # in-repo and HTML-escaped, so this does not expose user data.
    location /docs/ {
        try_files $uri $uri/index.html =404;
        include /etc/nginx/security-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'" always;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri /index.html;
        include /etc/nginx/security-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'" always;
        add_header Cache-Control "no-store";
    }
}
