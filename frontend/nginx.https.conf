upstream oncall_api {
    server api:8000;
    keepalive 64;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # If the API is ever proxied over HTTPS with an internal CA, mount that CA
    # as /etc/nginx/tls/ca.pem and uncomment:
    # proxy_ssl_trusted_certificate /etc/nginx/tls/ca.pem;

    location /api/ {
        proxy_pass http://oncall_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # $remote_addr is the TCP peer nginx itself accepted the connection
        # from - unlike X-Forwarded-For, a client cannot make this header
        # carry any value but its own real address (QA7 par. 8, E1 review).
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /calendar/ {
        proxy_pass http://oncall_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store";
    }
}
