upstream oncall_api {
    server api:8000;
    keepalive 64;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://oncall_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # $remote_addr is the TCP peer nginx itself accepted the connection
        # from - unlike X-Forwarded-For, a client cannot make this header
        # carry any value but its own real address (QA7 par. 8, E1 review).
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /calendar/ {
        proxy_pass http://oncall_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Static documentation, rendered from docs/*.md into the frontend's own
    # production assets. It needs a location of its own: the SPA fallback below
    # would answer /docs/ with the application shell, and the router would then
    # bounce the unknown path back to the dashboard.
    location /docs/ {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store";
    }
}
