upstream oncall_api {
    server api:8000;
    keepalive 64;
}

server {
    # Unprivileged ports: nginx runs as uid 101 (frontend/Dockerfile); Compose
    # maps ONCALL_WEB_HTTP_PORT on the host to this one.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Do not advertise the nginx version.
    server_tokens off;

    # The redirects nginx makes itself (/api -> /api/) carry the path alone.
    # An absolute one would name this container port, which is not the port
    # the client reached.
    absolute_redirect off;

    # Security headers for the whole server; the proxied /api and /calendar
    # locations below set no add_header of their own, so they inherit these.
    # The app ships a strict CSP: the theme bootstrap is an external script
    # (/theme-init.js), so no inline-script allowance is needed. 'unsafe-inline'
    # for styles covers React and the headless component library's inline
    # positioning styles.
    include /etc/nginx/security-headers.conf;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'" always;

    location /api/ {
        proxy_pass http://oncall_api;
        include /etc/nginx/proxy.conf;
        proxy_read_timeout 90s;
    }

    location /calendar/ {
        proxy_pass http://oncall_api;
        include /etc/nginx/proxy.conf;
    }

    # Static documentation, rendered from docs/*.md into the frontend's own
    # production assets. It needs a location of its own: the SPA fallback below
    # would answer /docs/ with the application shell, and the router would then
    # bounce the unknown path back to the dashboard.
    #
    # The re-declared add_headers (nginx drops inherited ones once a block sets
    # any): the documentation pages carry small inline bootstrap scripts, so
    # their CSP allows 'unsafe-inline' for scripts - the content is static,
    # in-repo and HTML-escaped, so this does not expose user data.
    location /docs/ {
        try_files $uri $uri/index.html =404;
        include /etc/nginx/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'" always;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri /index.html;
        include /etc/nginx/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'" always;
        add_header Cache-Control "no-store";
    }
}
