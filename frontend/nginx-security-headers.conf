# Security response headers shared by the HTTP and HTTPS presets. Included at
# the server level (so the proxied /api and /calendar responses inherit them)
# and again inside every location that sets its own add_header - nginx drops
# inherited add_headers the moment a block defines one of its own.
#
# `always` so the headers are sent on error responses too. Content-Security-
# Policy and Strict-Transport-Security are set next to each include, not here:
# the CSP differs between the app and the documentation, and HSTS belongs only
# on the HTTPS preset.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), usb=()" always;
