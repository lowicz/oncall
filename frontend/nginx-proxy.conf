# Request forwarding shared by every location proxied to the API (/api/ and
# /calendar/ in both presets). Included at /etc/nginx/proxy.conf
# (frontend/Dockerfile); a location that includes it sets these
# proxy_set_header lines itself, so nothing is inherited from the server.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# $remote_addr is the TCP peer nginx itself accepted the connection
# from - unlike X-Forwarded-For, a client cannot make this header
# carry any value but its own real address (QA7 par. 8, E1 review).
proxy_set_header X-Real-IP $remote_addr;
