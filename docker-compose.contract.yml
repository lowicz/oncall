services:
  contract-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: oncall_contract
      POSTGRES_USER: oncall_contract
      POSTGRES_PASSWORD: oncall_contract
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oncall_contract -d oncall_contract"]
      interval: 1s
      timeout: 3s
      retries: 30
