# Pull request and main-branch gates.
#
# One workflow, six parallel jobs that feed `ci-ok` for branch protection,
# plus a SonarCloud scan outside it. Nothing in the jobs behind `ci-ok` needs
# more than read access and nothing here pushes an image, so a pull request
# from a fork (read-only token, no secrets) still gets a green `ci-ok`. The
# SonarCloud job skips cleanly when SONAR_TOKEN is missing; the quality gate
# the ruleset requires is the `SonarCloud Code Analysis` status SonarCloud
# itself reports. CodeQL (codeql.yml) and Dependency Review
# (dependency-review.yml) are workflows of their own.
# release.yml calls this workflow before it publishes, so an image can only
# come from a commit that passed every required gate.
#
# Every action is pinned to a full commit SHA; Renovate (renovate.json5) moves
# the pins forward, and the tool versions in `env` below with them.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes the run in progress; on main every
# run completes so the check history stays whole.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The versions the images are built with (backend/Dockerfile,
  # frontend/Dockerfile); CI tests exactly those. UV_VERSION is also the
  # `required-version` of backend/pyproject.toml, which uv enforces.
  UV_VERSION: "0.12.23"
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "24"

jobs:
  backend:
    name: backend (ruff, mypy, pytest on SQLite, OpenAPI snapshot)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # Before the install: `--frozen` takes uv.lock as it is, so a lock that
      # no longer matches pyproject.toml has to fail here, not after an
      # install from it.
      - name: Lock matches pyproject.toml
        run: uv lock --check
      - name: Install from the lock
        run: uv sync --extra dev --frozen
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Format
        run: uv run --frozen ruff format --check .
      - name: Types
        run: uv run --frozen mypy
      - name: Tests (SQLite)
        run: uv run --frozen pytest -q -n auto --dist worksteal --cov --cov-report=xml:coverage.xml --junitxml "$RUNNER_TEMP/junit-backend.xml"
      - name: OpenAPI contract matches the approved snapshot
        run: uv run --frozen python scripts/openapi_snapshot.py
      - name: Summary
        if: always()
        run: python3 ../.github/scripts/junit-summary.py "Backend (SQLite)" "$RUNNER_TEMP/junit-backend.xml" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-backend
          path: ${{ runner.temp }}/junit-backend.xml
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-backend
          path: backend/coverage.xml
          retention-days: 7
          if-no-files-found: error

  backend-postgres:
    # SQLite serialises writers, so tests/test_concurrency_postgres.py runs
    # against a real PostgreSQL, and tests/test_schema_postgres.py checks what
    # SQLite and `alembic check` cannot see. Both skip themselves without the
    # URL below; backend/contracts/README.md requires them to run in CI.
    name: backend (PostgreSQL concurrency suite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      # The stack's PostgreSQL release (the tag of docker-compose.yml, which
      # .github/scripts/compose-postgres-volume.sh holds this line to) on the
      # image's default initdb: no Polish database collation, so the Polish
      # order test proves the collation the name columns carry themselves.
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: oncall_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d oncall_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      ONCALL_TEST_POSTGRES_URL: postgresql+asyncpg://test:test@localhost:5432/oncall_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install from the lock
        run: uv sync --extra dev --frozen
      # The database is still empty here, so the migrations run from the
      # first one; `alembic check` then fails if the ORM metadata and the
      # migrated schema differ. The suite below builds its own tables.
      - name: Migrations from an empty database
        env:
          ONCALL_DATABASE_URL: ${{ env.ONCALL_TEST_POSTGRES_URL }}
        run: uv run --frozen alembic upgrade head
      - name: ORM metadata matches the migrated schema
        env:
          ONCALL_DATABASE_URL: ${{ env.ONCALL_TEST_POSTGRES_URL }}
        run: uv run --frozen alembic check
      - name: Tests (PostgreSQL)
        run: uv run --frozen pytest -q tests/test_concurrency_postgres.py tests/test_schema_postgres.py --junitxml "$RUNNER_TEMP/junit-backend-postgres.xml"
      - name: Summary
        if: always()
        run: python3 ../.github/scripts/junit-summary.py "Backend (PostgreSQL)" "$RUNNER_TEMP/junit-backend-postgres.xml" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-backend-postgres
          path: ${{ runner.temp }}/junit-backend-postgres.xml
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    name: frontend (eslint, tsc, vitest, build with docs)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install from the lock
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm test -- --coverage --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/junit-frontend.xml"
      - name: Build (prebuild renders docs/ and checks its table of contents, links and anchors)
        run: npm run build
      - name: Standalone documentation site renders (what pages.yml deploys)
        run: node scripts/build-docs.mjs --site --out "$RUNNER_TEMP/site" --version "ci-${GITHUB_SHA::7}" --repo-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
      - name: Summary
        if: always()
        run: python3 ../.github/scripts/junit-summary.py "Frontend (vitest)" "$RUNNER_TEMP/junit-frontend.xml" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-frontend
          path: ${{ runner.temp }}/junit-frontend.xml
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-frontend
          path: frontend/coverage/lcov.info
          retention-days: 7
          if-no-files-found: error

  compose-config:
    name: compose files (production, dev overlay, TLS and LDAP CA overlays)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ONCALL_VERSION: 0.0.0-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Production file
        run: docker compose -f docker-compose.yml config --quiet
      - name: Production file refuses to start without a version
        run: |
          if ONCALL_VERSION='' docker compose -f docker-compose.yml config --quiet 2> /dev/null; then
            echo "::error::docker-compose.yml accepted an empty ONCALL_VERSION"
            exit 1
          fi
      - name: Production file with the TLS overlay
        run: docker compose -f docker-compose.yml -f docker-compose.tls.yml config --quiet
      - name: Production file with the LDAP CA overlay, with and without TLS
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ldap-ca.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.tls.yml -f docker-compose.ldap-ca.yml config --quiet
      - name: Production file with the SMTP CA overlay, alone and with every other overlay
        run: |
          docker compose -f docker-compose.yml -f docker-compose.smtp-ca.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.tls.yml -f docker-compose.ldap-ca.yml -f docker-compose.smtp-ca.yml config --quiet
      - name: Development overlay, with and without TLS
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.tls.yml config --quiet
      - name: The development overlay changes nothing but where images come from
        run: .github/scripts/compose-parity.sh
      - name: Documented environment variables are wired into Compose
        run: |
          bash .github/scripts/env-vars-wired.test.sh
          .github/scripts/env-vars-wired.sh
      - name: Every service is read-only and drops all capabilities; db publishes no port
        run: .github/scripts/compose-hardening.sh
      - name: PostgreSQL runs one release everywhere and its data volume is named after its major
        run: .github/scripts/compose-postgres-volume.sh
      - name: User systemd unit calls the stack script
        run: .github/scripts/systemd-user-unit.sh
      - name: Deployment update script (POSIX sh, .env merge, whole runs)
        run: |
          shellcheck --shell=sh deploy/update.sh deploy/update.test.sh
          sh deploy/update.test.sh

  backup:
    # oncall-backup.test.sh drives the real script against rootless Podman on
    # the runner: the stack's postgres image, hardened, stands in for its db,
    # a PostgreSQL 17 db service started by `podman compose` is moved to 18 by
    # upgrade-postgres, under docker-compose and podman-compose, and every
    # container, volume and file the test or the script creates must be gone
    # afterwards. One runner per Compose provider, so the two runs overlap.
    name: database backup (${{ matrix.compose }}; setup, dump, restore test, restore, PostgreSQL upgrade, cleanup on Podman)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compose: [docker-compose, podman-compose]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scripts pass shellcheck
        run: shellcheck deploy/backup/*.sh
      - name: Units and timer load in systemd
        run: systemd-analyze verify deploy/backup/oncall-backup.service deploy/backup/oncall-backup-alert.service deploy/backup/oncall-backup.timer
      - name: Production setup (stubbed systemd, loginctl and Podman)
        run: bash deploy/backup/setup.test.sh
      - name: Dump, restore test, retention, restore, alert, PostgreSQL upgrade and cleanup against rootless Podman
        if: matrix.compose == 'docker-compose'
        run: |
          podman --version
          bash deploy/backup/oncall-backup.test.sh
      # podman-compose makes each container require the ones its service
      # depends on, and Podman removes no container another one requires.
      - name: The same against rootless Podman with podman-compose as the Compose provider
        if: matrix.compose == 'podman-compose'
        env:
          PODMAN_COMPOSE_PROVIDER: podman-compose
        run: |
          sudo apt-get update --quiet
          sudo apt-get install --yes --no-install-recommends podman-compose
          podman-compose --version
          bash deploy/backup/oncall-backup.test.sh

  workflows:
    name: workflow files (pinned actions, token permissions, no Dependabot updates)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Actions pinned to SHAs, permissions declared, Renovate the only update bot
        run: .github/scripts/workflow-security.sh

  image-build:
    # Builds both Dockerfiles exactly as release.yml will, but never pushes:
    # this job runs for pull requests, including ones from forks. The build is
    # loaded into the runner's Docker only to check who the image runs as and,
    # for web, which nginx it runs.
    name: image builds (${{ matrix.name }}, no push)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: backend
            dockerfile: backend/Dockerfile
          - name: web
            context: .
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: oncall-${{ matrix.name }}:ci
          build-args: ONCALL_VERSION=ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          # A fork's token cannot write this repository's cache; reading is fine.
          cache-to: ${{ github.event.pull_request.head.repo.fork != true && format('type=gha,mode=max,scope={0}', matrix.name) || '' }}
      # Compose drops every capability, which only an unprivileged process
      # runs well under; a base image or Dockerfile change that falls back to
      # root fails here instead of in a deployment.
      - name: The image runs as an unprivileged user
        env:
          IMAGE: oncall-${{ matrix.name }}:ci
        run: |
          uid=$(docker run --rm --entrypoint id "$IMAGE" -u)
          if [ "$uid" = 0 ]; then
            echo "::error::$IMAGE runs as root"
            exit 1
          fi
          echo "$IMAGE runs as uid $uid"
      # frontend/Dockerfile pins one nginx release; the image must run exactly
      # that one, so a tag that does not hold the nginx it names, or a build
      # that swaps the base, fails here instead of in a release.
      - name: The web image runs the nginx release its Dockerfile pins
        if: matrix.name == 'web'
        env:
          IMAGE: oncall-${{ matrix.name }}:ci
        run: |
          pinned=$(sed -En 's/^FROM nginxinc\/nginx-unprivileged:([0-9]+\.[0-9]+\.[0-9]+)-alpine([[:space:]].*)?$/\1/p' frontend/Dockerfile)
          running=$(docker run --rm --entrypoint nginx "$IMAGE" -v 2>&1 | sed -n 's|^nginx version: nginx/||p')
          if [ -z "$pinned" ] || [ "$running" != "$pinned" ]; then
            echo "::error::$IMAGE runs nginx '$running', frontend/Dockerfile pins '$pinned'"
            exit 1
          fi
          echo "$IMAGE runs nginx $running"

  sonarcloud:
    # Static analysis on SonarCloud (https://sonarcloud.io). Not in ci-ok's
    # needs list: fork pull requests have no SONAR_TOKEN, and a missing token
    # must not turn ci-ok red. The job itself exits green when the secret is
    # unavailable. The merge gate is SonarCloud's quality gate, the
    # `SonarCloud Code Analysis` status the SonarCloud app reports after this
    # scan, which the `main-protected` ruleset requires next to ci-ok
    # (docs/wdrozenie/wydania.md). Project key and organisation live in
    # sonar-project.properties at the repository root. It waits for the test
    # jobs because it reads their coverage reports.
    name: SonarCloud
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check whether SONAR_TOKEN is available
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "SONAR_TOKEN unavailable; skipping SonarCloud scan."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.available == 'true'
        with:
          # Full history improves blame and new-code detection on SonarCloud.
          fetch-depth: 0
          persist-credentials: false
      # Back where the test jobs wrote them, the paths sonar-project.properties
      # names.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.token.outputs.available == 'true'
        with:
          name: coverage-backend
          path: backend
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.token.outputs.available == 'true'
        with:
          name: coverage-frontend
          path: frontend/coverage
      - name: SonarCloud Scan
        if: steps.token.outputs.available == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  ci-ok:
    # The one status branch protection requires. The `main-protected` ruleset
    # must list it as `ci-ok` from GitHub Actions, the name every pull request
    # reports; `ci / ci-ok` is this job only when release.yml calls the
    # workflow as job `ci`, so requiring that name blocks every pull request
    # (docs/wdrozenie/wydania.md, "Ustawienia repozytorium"). `if: always()`
    # so a failed or cancelled job still produces a (red) status instead of
    # a missing one. sonarcloud is deliberately absent from needs: a fork PR
    # has no SONAR_TOKEN and must not turn ci-ok red; the ruleset requires
    # SonarCloud's own quality gate status instead.
    name: ci-ok
    if: always()
    needs: [backend, backend-postgres, frontend, compose-config, backup, workflows, image-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every gate passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
