# Pull request and main-branch gates.
#
# One workflow, five parallel jobs and one aggregating check (`ci-ok`) for
# branch protection. Nothing here needs more than read access and nothing here
# pushes an image, so a pull request from a fork (read-only token, no secrets)
# runs exactly the same jobs. release.yml calls this workflow before it
# publishes, so an image can only come from a commit that passed every gate.
#
# Every action is pinned to a full commit SHA; Renovate (renovate.json5) moves
# the pins forward, and the tool versions in `env` below with them.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes the run in progress; on main every
# run completes so the check history stays whole.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The versions the images are built with (backend/Dockerfile,
  # frontend/Dockerfile); CI tests exactly those.
  UV_VERSION: "0.12.7"
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "22"

jobs:
  backend:
    name: backend (ruff, mypy, pytest on SQLite, OpenAPI snapshot)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install from the lock
        run: uv sync --extra dev --frozen
      - name: Lock matches pyproject.toml
        run: uv lock --check
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Format
        run: uv run --frozen ruff format --check .
      - name: Types
        run: uv run --frozen mypy
      - name: Tests (SQLite)
        run: uv run --frozen pytest -q --junitxml "$RUNNER_TEMP/junit-backend.xml"
      - name: OpenAPI contract matches the approved snapshot
        run: uv run --frozen python scripts/openapi_snapshot.py
      - name: Summary
        if: always()
        run: python3 ../.github/scripts/junit-summary.py "Backend (SQLite)" "$RUNNER_TEMP/junit-backend.xml" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: junit-backend
          path: ${{ runner.temp }}/junit-backend.xml
          retention-days: 7
          if-no-files-found: ignore

  backend-postgres:
    # SQLite serialises writers, so tests/test_concurrency_postgres.py runs
    # against a real PostgreSQL. It skips itself without the URL below;
    # backend/contracts/README.md requires it to run in CI.
    name: backend (PostgreSQL concurrency suite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: oncall_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d oncall_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      ONCALL_TEST_POSTGRES_URL: postgresql+asyncpg://test:test@localhost:5432/oncall_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install from the lock
        run: uv sync --extra dev --frozen
      - name: Tests (PostgreSQL)
        run: uv run --frozen pytest -q tests/test_concurrency_postgres.py --junitxml "$RUNNER_TEMP/junit-backend-postgres.xml"
      - name: Summary
        if: always()
        run: python3 ../.github/scripts/junit-summary.py "Backend (PostgreSQL)" "$RUNNER_TEMP/junit-backend-postgres.xml" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: junit-backend-postgres
          path: ${{ runner.temp }}/junit-backend-postgres.xml
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    name: frontend (eslint, tsc, vitest, build with docs)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install from the lock
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Types
        run: npx tsc -b
      - name: Tests
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/junit-frontend.xml"
      - name: Build (prebuild renders docs/ and checks its table of contents, links and anchors)
        run: npm run build
      - name: Standalone documentation site renders (what pages.yml deploys)
        run: node scripts/build-docs.mjs --site --out "$RUNNER_TEMP/site" --version "ci-${GITHUB_SHA::7}" --repo-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
      - name: Summary
        if: always()
        run: python3 ../.github/scripts/junit-summary.py "Frontend (vitest)" "$RUNNER_TEMP/junit-frontend.xml" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: junit-frontend
          path: ${{ runner.temp }}/junit-frontend.xml
          retention-days: 7
          if-no-files-found: ignore

  compose-config:
    name: compose files (production, dev overlay, TLS overlay)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ONCALL_VERSION: 0.0.0-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Production file
        run: docker compose -f docker-compose.yml config --quiet
      - name: Production file refuses to start without a version
        run: |
          if ONCALL_VERSION='' docker compose -f docker-compose.yml config --quiet 2> /dev/null; then
            echo "::error::docker-compose.yml accepted an empty ONCALL_VERSION"
            exit 1
          fi
      - name: Production file with the TLS overlay
        run: docker compose -f docker-compose.yml -f docker-compose.tls.yml config --quiet
      - name: Development overlay, with and without TLS
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.tls.yml config --quiet
      - name: The development overlay changes nothing but where images come from
        run: .github/scripts/compose-parity.sh

  image-build:
    # Builds both Dockerfiles exactly as release.yml will, but never pushes:
    # this job runs for pull requests, including ones from forks.
    name: image builds (${{ matrix.name }}, no push)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: backend
            dockerfile: backend/Dockerfile
          - name: web
            context: .
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          build-args: ONCALL_VERSION=ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          # A fork's token cannot write this repository's cache; reading is fine.
          cache-to: ${{ github.event.pull_request.head.repo.fork != true && format('type=gha,mode=max,scope={0}', matrix.name) || '' }}

  ci-ok:
    # The one status branch protection requires. `if: always()` so a failed
    # or cancelled job still produces a (red) status instead of a missing one.
    name: ci-ok
    if: always()
    needs: [backend, backend-postgres, frontend, compose-config, image-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every gate passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
