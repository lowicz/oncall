# Release: pushing a tag `vMAJOR.MINOR.PATCH[-prerelease]` publishes the two
# application images to GHCR and creates the GitHub Release.
#
#   git tag -a v1.2.0 -m "v1.2.0" && git push origin v1.2.0
#
# validate  - strict semver, and the version must not exist in GHCR yet:
#             published versions are immutable, a rerun of the same tag is a
#             mistake by construction.
# ci        - the same gates as every pull request (ci.yml); an image can only
#             come from a commit that passed them.
# build     - one job per image (api, web): build, push, SBOM and SLSA
#             provenance attached by BuildKit, a GitHub attestation, a keyless
#             cosign signature. Tags: X.Y.Z, X.Y, X, latest; a prerelease gets
#             only its own tag.
# release   - the GitHub Release with generated notes, image digests and the
#             commands to verify them.
#
# Only GITHUB_TOKEN and the job's OIDC identity are used; the repository has
# no secrets. Nothing here runs on pull requests.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      packages: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      owner: ${{ steps.tag.outputs.owner }}
    steps:
      - name: Tag is strict semver
        id: tag
        env:
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$TAG' is not vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease"
            exit 1
          fi
          version="${TAG#v}"
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "owner=${OWNER,,}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Version is not published yet
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          OWNER: ${{ steps.tag.outputs.owner }}
        run: |
          for image in oncall-api oncall-web; do
            ref="ghcr.io/$OWNER/$image:$VERSION"
            if docker manifest inspect "$ref" > /dev/null 2>&1; then
              echo "::error::$ref already exists. Published versions are immutable; tag the next version instead."
              exit 1
            fi
          done

  ci:
    name: ci
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: build and publish ${{ matrix.name }}
    needs: [validate, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - name: api
            context: backend
            dockerfile: backend/Dockerfile
            description: On-call API and worker (FastAPI, CP-SAT scheduler)
          - name: web
            context: .
            dockerfile: frontend/Dockerfile
            description: On-call web (nginx, SPA and documentation)
    env:
      IMAGE: ghcr.io/${{ needs.validate.outputs.owner }}/oncall-${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tags and labels from the git tag
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # semver tags skip X.Y and X for a prerelease, and `latest` (flavor
          # latest=auto) is only added for a stable version.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=oncall-${{ matrix.name }}
            org.opencontainers.image.description=${{ matrix.description }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ONCALL_VERSION=${{ needs.validate.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: GitHub build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Keyless signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Record what was published
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "${IMAGE}@${DIGEST}"
            while IFS= read -r tag; do echo "  $tag"; done <<< "$TAGS"
          } > "$RUNNER_TEMP/digest-${{ matrix.name }}.txt"
          {
            echo "### ${IMAGE}"
            echo
            echo '```'
            cat "$RUNNER_TEMP/digest-${{ matrix.name }}.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.name }}
          path: ${{ runner.temp }}/digest-${{ matrix.name }}.txt
          retention-days: 7

  release:
    name: GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          OWNER: ${{ needs.validate.outputs.owner }}
          WORKFLOW_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          {
            echo "## Obrazy"
            echo
            echo '```'
            cat digests/*.txt
            echo '```'
            echo
            echo "Uruchomienie: \`ONCALL_VERSION=${VERSION}\` w \`.env\`, potem \`docker compose pull && docker compose up -d\` (docs/wdrozenie/wydania.md)."
            echo
            echo "Weryfikacja pochodzenia (dla każdego obrazu):"
            echo
            echo '```'
            echo "gh attestation verify oci://ghcr.io/${OWNER}/oncall-api:${VERSION} --owner ${OWNER}"
            echo "cosign verify ghcr.io/${OWNER}/oncall-api:${VERSION} \\"
            echo "  --certificate-identity ${WORKFLOW_IDENTITY} \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
            echo
          } > notes.md
          args=(--verify-tag --title "$TAG" --generate-notes --notes-file notes.md)
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}"
